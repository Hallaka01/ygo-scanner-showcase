<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="title description">
  <title id="title">YGO Scanner</title>
  <desc id="description">A native iPhone collection companion, presented in the app's purple and gold Millennium palette.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#28173F"/><stop offset="0.6" stop-color="#120B1D"/><stop offset="1" stop-color="#0D0816"/>
    </linearGradient>
    <linearGradient id="gold" x2="1" y2="1">
      <stop stop-color="#70502C"/><stop offset="0.25" stop-color="#E6BF70"/><stop offset="0.5" stop-color="#FFF1C5"/><stop offset="0.75" stop-color="#E6BF70"/><stop offset="1" stop-color="#70502C"/>
    </linearGradient>
    <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#28173F"/><stop offset="1" stop-color="#211433"/></linearGradient>
    <pattern id="grain" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 1h4m4 5h3M2 10h3" stroke="#FFF1C5" stroke-opacity="0.035" stroke-width="0.5"/></pattern>
  </defs>
  <rect x="1" y="1" width="1598" height="478" rx="20" fill="url(#background)" stroke="#645137" stroke-width="2"/>
  <rect x="1" y="1" width="1598" height="478" rx="20" fill="url(#grain)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
    <g fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round">
      <path d="M67 78V63h15m25 0h15v15m0 25v15h-15m-25 0H67v-15"/>
      <rect x="82" y="77" width="25" height="29" rx="4"/>
    </g>
    <text x="144" y="95" font-size="20" font-weight="600" letter-spacing="2" fill="#E6BF70">HALLAKA / NATIVE iOS APP</text>
    <text x="62" y="208" font-size="82" font-weight="700" letter-spacing="-2.5" fill="#FFF8EA">YGO Scanner</text>
    <text x="66" y="264" font-size="27" fill="#D2C5E0">Scan cards. Organize your collection.</text>
    <text x="66" y="305" font-size="27" fill="#D2C5E0">Build decks around the copies you own.</text>
    <g transform="translate(66 359)">
      <rect width="545" height="56" rx="18" fill="url(#gold)"/>
      <text x="27" y="35" font-size="20" font-weight="600" fill="#140F06">SwiftUI</text>
      <path d="M126 17v22m159-22v22" stroke="#70502C" stroke-opacity="0.45"/>
      <text x="152" y="35" font-size="20" font-weight="600" fill="#140F06">SwiftData</text>
      <text x="312" y="35" font-size="20" font-weight="600" fill="#140F06">Camera + Vision</text>
    </g>
    <g transform="translate(990 39)">
      <rect width="548" height="402" rx="18" fill="url(#panel)" stroke="url(#gold)" stroke-width="2"/>
      <text x="28" y="47" font-size="24" font-weight="700" fill="#FFF8EA">Collection</text>
      <rect x="28" y="69" width="492" height="58" rx="15" fill="url(#gold)"/>
      <text x="48" y="106" font-size="22" font-weight="700" fill="#140F06">MILLENNIUM</text>
      <text x="327" y="105" font-size="17" fill="#140F06">Your card gallery</text>
      <g transform="translate(28 151)" stroke="url(#gold)" fill="#120B1D">
        <rect width="148" height="222" rx="14" stroke-width="2"/>
        <rect x="158" width="148" height="222" rx="14" stroke-width="2"/>
        <rect x="316" width="148" height="222" rx="14" stroke-width="2"/>
        <g fill="none" stroke="#BA96EF" stroke-width="1.5">
          <circle cx="74" cy="97" r="45"/><circle cx="74" cy="97" r="33"/>
          <circle cx="232" cy="97" r="45"/><path d="M199 97h66m-33-33v66"/>
          <circle cx="390" cy="97" r="45"/><path d="M390 59l33 57h-66z"/>
        </g>
        <g fill="#E6BF70" stroke="none"><circle cx="74" cy="97" r="17"/><circle cx="232" cy="97" r="12"/><circle cx="390" cy="97" r="9"/></g>
        <g fill="#D2C5E0" stroke="none" font-size="12"><text x="15" y="28">ORBIT SCOUT</text><text x="173" y="28">TIDAL OBSERVER</text><text x="331" y="28">MOSS COURIER</text></g>
        <g stroke="#645137"><path d="M15 169h118m40 0h118m40 0h118"/></g>
        <g fill="#E6BF70" stroke="none" font-size="14" font-weight="600"><text x="15" y="199">2 copies</text><text x="173" y="199">3 copies</text><text x="331" y="199">1 copy</text></g>
      </g>
    </g>
  </g>
